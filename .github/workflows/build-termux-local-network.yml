name: Build Termux release with local network access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-termux-local-network.yml

permissions:
  contents: read

jobs:
  build:
    name: Build patched release APK
    runs-on: ubuntu-latest

    steps:
      - name: Find latest upstream Google Play release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="$(
            gh api               --paginate               -H "Accept: application/vnd.github+json"               /repos/termux-play-store/termux-apps/releases               --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("termux-app-googleplay.")))] | sort_by(.published_at) | last | .tag_name'
          )"

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No termux-app-googleplay release found" >&2
            exit 1
          fi

          echo "Using upstream release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Clone upstream release
        shell: bash
        run: |
          set -euo pipefail
          git clone             --depth 1             --branch "${{ steps.release.outputs.tag }}"             https://github.com/termux-play-store/termux-apps.git             source

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Patch Android 17 local network permission
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          manifest = Path("termux-app/src/main/AndroidManifest.xml")
          activity = Path("termux-app/src/main/java/com/termux/app/TermuxActivity.java")
          permissions = Path("termux-app/src/main/java/com/termux/app/TermuxPermissionUtils.java")
          gradle = Path("termux-app/build.gradle.kts")

          # 1) Declare ACCESS_LOCAL_NETWORK in AndroidManifest.xml.
          text = manifest.read_text()
          if "android.permission.ACCESS_LOCAL_NETWORK" not in text:
              marker = '    <uses-permission android:name="android.permission.INTERNET" />'
              if marker not in text:
                  raise SystemExit(f"Could not find INTERNET permission marker in {manifest}")
              text = text.replace(
                  marker,
                  marker
                  + '\n    <!-- Android 17 / API 37 local network access -->'
                  + '\n    <uses-permission android:name="android.permission.ACCESS_LOCAL_NETWORK" />',
                  1,
              )
              manifest.write_text(text)

          # 2) Add constants used for the runtime permission request.
          text = permissions.read_text()
          if "REQUEST_ACCESS_LOCAL_NETWORK" not in text:
              marker = "    public static final int REQUEST_POST_NOTIFICATIONS = 2002;"
              if marker not in text:
                  raise SystemExit(f"Could not find permission request marker in {permissions}")
              text = text.replace(
                  marker,
                  marker
                  + '\n    public static final int REQUEST_ACCESS_LOCAL_NETWORK = 2003;'
                  + '\n    public static final String PERMISSION_ACCESS_LOCAL_NETWORK = "android.permission.ACCESS_LOCAL_NETWORK";',
                  1,
              )
              permissions.write_text(text)

          # 3) Request ACCESS_LOCAL_NETWORK when Termux starts on Android 17+.
          text = activity.read_text()
          if "REQUEST_ACCESS_LOCAL_NETWORK" not in text:
              marker = """        if (Build.VERSION.SDK_INT >= 33) {
                      TermuxPermissionUtils.requestPermissions(this,
                          TermuxPermissionUtils.REQUEST_POST_NOTIFICATIONS,
                          Manifest.permission.POST_NOTIFICATIONS
                      );
                  }
              """
              if marker not in text:
                  raise SystemExit(f"Could not find onStart permission block in {activity}")
              replacement = marker + """
                  if (Build.VERSION.SDK_INT >= 37) {
                      TermuxPermissionUtils.requestPermissions(this,
                          TermuxPermissionUtils.REQUEST_ACCESS_LOCAL_NETWORK,
                          TermuxPermissionUtils.PERMISSION_ACCESS_LOCAL_NETWORK
                      );
                  }
              """
              text = text.replace(marker, replacement, 1)
              activity.write_text(text)

          # 4) Android requires an APK signature even for adb install.
          # Use the repository's bundled test key so no private CI secret is needed.
          text = gradle.read_text()
          signing_line = '            signingConfig = signingConfigs.getByName("debug")'
          if signing_line not in text:
              marker = '         getByName("release") {'
              if marker not in text:
                  raise SystemExit(f"Could not find release build type in {gradle}")
              text = text.replace(marker, marker + '\n' + signing_line, 1)
              gradle.write_text(text)

          # Keep generated edits clean so git diff --check catches real problems only.
          for path in (manifest, activity, permissions, gradle):
              clean = "\n".join(line.rstrip() for line in path.read_text().splitlines()) + "\n"
              path.write_text(clean)

          print("Patched files:")
          for path in (manifest, activity, permissions, gradle):
              print(f"  {path}")
          PY

          git diff --check
          git diff --             termux-app/src/main/AndroidManifest.xml             termux-app/src/main/java/com/termux/app/TermuxActivity.java             termux-app/src/main/java/com/termux/app/TermuxPermissionUtils.java             termux-app/build.gradle.kts

      - name: Build release APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :termux-app:assembleRelease

      - name: Collect APK and checksum
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find termux-app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Release APK was not produced" >&2
            exit 1
          fi

          mkdir -p ../upload
          OUT="../upload/termux-local-network-${{ steps.release.outputs.tag }}-release.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

          ls -lh ../upload

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: termux-local-network-${{ steps.release.outputs.tag }}
          path: upload/
          if-no-files-found: error
          retention-days: 30

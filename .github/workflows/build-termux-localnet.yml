name: Build parallel Termux LocalNet

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-termux-localnet.yml

permissions:
  contents: read

env:
  APP_ID: com.termux.localnet
  APP_TAG: termux-app-googleplay.2026.06.21
  PACKAGES_TAG: bootstrap-2026.06.21-r2

jobs:
  bootstrap:
    name: Build custom arm64 bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout matching Termux packages sources
        uses: actions/checkout@v7
        with:
          repository: termux-play-store/termux-packages
          ref: ${{ env.PACKAGES_TAG }}

      - name: Configure custom Termux package name
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path("scripts/properties.sh")
          text = p.read_text()

          old = 'TERMUX_APP_PACKAGE="com.termux"'
          new = 'TERMUX_APP_PACKAGE="com.termux.localnet"'
          if old not in text:
              raise SystemExit("TERMUX_APP_PACKAGE marker not found")
          text = text.replace(old, new, 1)

          old = 'TERMUX_REPO_PACKAGE="com.termux"'
          new = 'TERMUX_REPO_PACKAGE="com.termux.localnet"'
          if old in text:
              text = text.replace(old, new, 1)

          p.write_text(text)
          PY

          grep -E 'TERMUX_APP_PACKAGE|TERMUX_BASE_DIR|TERMUX_PREFIX=' scripts/properties.sh

      - name: Build arm64 bootstrap for com.termux.localnet
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh -f --architectures aarch64

      - name: Verify bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -s bootstrap-aarch64.zip
          sha256sum bootstrap-aarch64.zip
          unzip -p bootstrap-aarch64.zip SYMLINKS.txt >/dev/null || true

      - name: Upload custom bootstrap
        uses: actions/upload-artifact@v7
        with:
          name: termux-localnet-bootstrap-aarch64
          path: bootstrap-aarch64.zip
          if-no-files-found: error
          retention-days: 7

  app:
    name: Build parallel release APK
    needs: bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Clone Google Play Termux release
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${APP_TAG}" https://github.com/termux-play-store/termux-apps.git source

      - name: Download custom bootstrap
        uses: actions/download-artifact@v8
        with:
          name: termux-localnet-bootstrap-aarch64
          path: custom-bootstrap

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Patch app id, paths, manifest and Android 17 LAN permission
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cp ../custom-bootstrap/bootstrap-aarch64.zip termux-app/src/main/cpp/bootstrap-aarch64.zip

          python3 <<'PY'
          from pathlib import Path
          import hashlib

          APP_ID = "com.termux.localnet"

          manifest = Path("termux-app/src/main/AndroidManifest.xml")
          activity = Path("termux-app/src/main/java/com/termux/app/TermuxActivity.java")
          permissions = Path("termux-app/src/main/java/com/termux/app/TermuxPermissionUtils.java")
          constants = Path("termux-app/src/main/java/com/termux/app/TermuxConstants.java")
          content_provider = Path("termux-app/src/main/java/com/termux/app/TermuxContentProvider.java")
          share_api = Path("termux-app/src/main/java/com/termux/app/api/ShareAPI.java")
          shortcuts = Path("termux-app/src/main/res/xml/shortcuts.xml")
          strings = Path("termux-app/src/main/res/values/strings.xml")
          gradle = Path("termux-app/build.gradle.kts")
          bootstrap = Path("termux-app/src/main/cpp/bootstrap-aarch64.zip")

          # Android application id differs from Java namespace on purpose.
          text = gradle.read_text()
          default_marker = "    defaultConfig {"
          if 'applicationId = "com.termux.localnet"' not in text:
              if default_marker not in text:
                  raise SystemExit("defaultConfig marker not found")
              text = text.replace(
                  default_marker,
                  default_marker + '\n        applicationId = "com.termux.localnet"',
                  1,
              )

          text = text.replace(
              'versionName = "googleplay.2026.06.21"',
              'versionName = "googleplay.2026.06.21-localnet"',
              1,
          )
          text = text.replace(
              'abiFilters += listOf("armeabi-v7a", "arm64-v8a", "x86_64")',
              'abiFilters += listOf("arm64-v8a")',
              1,
          )

          # Use the custom bootstrap and keep only arm64 in this parallel build.
          digest = hashlib.sha256(bootstrap.read_bytes()).hexdigest()
          old_arches = '''        val arches = mapOf(
                      "aarch64" to "0aaa4b890c4de28c1da01c2a12bfbf342009faf626e6b504aed303e6a936bebe",
                      "arm" to "a0c3f9c0bb313ad5e371150a462bfe975c0108a444cf6f7f8c89173b9e9dc5f8",
                      "x86_64" to "1799aef733532fe29eb913968302d681a9d22b5c38654b980330ceb0e182aa64"
                  )'''
          new_arches = f'''        val arches = mapOf(
                      "aarch64" to "{digest}"
                  )'''
          if old_arches not in text:
              raise SystemExit("bootstrap hash map marker not found")
          text = text.replace(old_arches, new_arches, 1)

          old_proot = '''        downloadFile(projectDir, "src/main/jniLibs/armeabi-v7a/libproot-loader.so", prootUrl.replace("ARCH", "arm"), "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855")
                  downloadFile(projectDir, "src/main/jniLibs/arm64-v8a/libproot-loader.so", prootUrl.replace("ARCH", "aarch64"), "f7e3211e4c210c2a39a1f22b7f38666d99aee172fd009c0d19b84108cf20bb42")
                  downloadFile(projectDir, "src/main/jniLibs/x86_64/libproot-loader.so", prootUrl.replace("ARCH", "x86_64"), "86e22d456255417e1d4ee874986571578ff26675ae2e372458e0d87f26454c63")'''
          new_proot = '''        downloadFile(projectDir, "src/main/jniLibs/arm64-v8a/libproot-loader.so", prootUrl.replace("ARCH", "aarch64"), "f7e3211e4c210c2a39a1f22b7f38666d99aee172fd009c0d19b84108cf20bb42")'''
          if old_proot not in text:
              raise SystemExit("proot loader marker not found")
          text = text.replace(old_proot, new_proot, 1)

          # Sign release with repository test key so Android can install it.
          release_marker = '         getByName("release") {'
          signed_release_marker = release_marker + '\n            signingConfig = signingConfigs.getByName("debug")'
          if signed_release_marker not in text:
              if release_marker not in text:
                  raise SystemExit("release build type marker not found")
              text = text.replace(release_marker, signed_release_marker, 1)
          gradle.write_text(text)

          # Runtime filesystem paths must match the new Android application id.
          text = constants.read_text()
          if 'public static final String PACKAGE_NAME = "com.termux";' not in text:
              raise SystemExit("TermuxConstants package marker not found")
          constants.write_text(text.replace(
              'public static final String PACKAGE_NAME = "com.termux";',
              'public static final String PACKAGE_NAME = "com.termux.localnet";',
              1,
          ))

          # Manifest identifiers that must be globally unique when both Termux apps are installed.
          text = manifest.read_text()
          replacements = {
              "com.termux.permission.TERMUX_INTERNAL": "com.termux.localnet.permission.TERMUX_INTERNAL",
              "com.termux.sharedfile.READ_WRITE": "com.termux.localnet.sharedfile.READ_WRITE",
              'android:authorities="com.termux.documents"': 'android:authorities="com.termux.localnet.documents"',
              'android:authorities="com.termux.files"': 'android:authorities="com.termux.localnet.files"',
              'android:authorities="com.termux.sharedfile"': 'android:authorities="com.termux.localnet.sharedfile"',
              'android:taskAffinity="com.termux.filereceiver"': 'android:taskAffinity="com.termux.localnet.filereceiver"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Manifest marker not found: {old}")
              text = text.replace(old, new)

          if "android.permission.ACCESS_LOCAL_NETWORK" not in text:
              marker = '    <uses-permission android:name="android.permission.INTERNET" />'
              if marker not in text:
                  raise SystemExit("INTERNET permission marker not found")
              text = text.replace(
                  marker,
                  marker
                  + '\n    <!-- Android 17 / API 37 local network access -->'
                  + '\n    <uses-permission android:name="android.permission.ACCESS_LOCAL_NETWORK" />',
                  1,
              )
          manifest.write_text(text)

          # Code-side content provider authorities.
          text = content_provider.read_text()
          if '"com.termux.files"' not in text:
              raise SystemExit("TermuxContentProvider authority marker not found")
          content_provider.write_text(text.replace(
              '"com.termux.files"', '"com.termux.localnet.files"', 1
          ))

          text = share_api.read_text()
          if '.authority("com.termux.sharedfile")' not in text:
              raise SystemExit("ShareAPI authority marker not found")
          share_api.write_text(text.replace(
              '.authority("com.termux.sharedfile")',
              '.authority("com.termux.localnet.sharedfile")',
              1,
          ))

          # Launcher shortcuts need the new application id, but Java class stays in com.termux namespace.
          text = shortcuts.read_text()
          text = text.replace(
              'android:targetPackage="com.termux"',
              'android:targetPackage="com.termux.localnet"',
          )
          shortcuts.write_text(text)

          # Distinguish the two apps in the launcher.
          text = strings.read_text()
          if '<string name="application_name">Termux</string>' not in text:
              raise SystemExit("application_name marker not found")
          strings.write_text(text.replace(
              '<string name="application_name">Termux</string>',
              '<string name="application_name">Termux LocalNet</string>',
              1,
          ))

          # Android 17 runtime permission request.
          text = permissions.read_text()
          if "REQUEST_ACCESS_LOCAL_NETWORK" not in text:
              marker = "    public static final int REQUEST_POST_NOTIFICATIONS = 2002;"
              if marker not in text:
                  raise SystemExit("permission request marker not found")
              text = text.replace(
                  marker,
                  marker
                  + '\n    public static final int REQUEST_ACCESS_LOCAL_NETWORK = 2003;'
                  + '\n    public static final String PERMISSION_ACCESS_LOCAL_NETWORK = "android.permission.ACCESS_LOCAL_NETWORK";',
                  1,
              )
              permissions.write_text(text)

          text = activity.read_text()
          if "REQUEST_ACCESS_LOCAL_NETWORK" not in text:
              marker = """        if (Build.VERSION.SDK_INT >= 33) {
                      TermuxPermissionUtils.requestPermissions(this,
                          TermuxPermissionUtils.REQUEST_POST_NOTIFICATIONS,
                          Manifest.permission.POST_NOTIFICATIONS
                      );
                  }
              """
              if marker not in text:
                  raise SystemExit("TermuxActivity permission block not found")
              text = text.replace(
                  marker,
                  marker + """
                  if (Build.VERSION.SDK_INT >= 37) {
                      TermuxPermissionUtils.requestPermissions(this,
                          TermuxPermissionUtils.REQUEST_ACCESS_LOCAL_NETWORK,
                          TermuxPermissionUtils.PERMISSION_ACCESS_LOCAL_NETWORK
                      );
                  }
              """,
                  1,
              )
              activity.write_text(text)

          # Normalize generated edits.
          for path in (
              manifest, activity, permissions, constants, content_provider,
              share_api, shortcuts, strings, gradle
          ):
              clean = "\n".join(line.rstrip() for line in path.read_text().splitlines()) + "\n"
              path.write_text(clean)

          print("Custom bootstrap SHA-256:", digest)
          print("Application id:", APP_ID)
          PY

          git diff --check
          git diff --stat
          grep -R 'com.termux.localnet'             termux-app/src/main/AndroidManifest.xml             termux-app/src/main/java/com/termux/app/TermuxConstants.java             termux-app/src/main/java/com/termux/app/TermuxContentProvider.java             termux-app/src/main/java/com/termux/app/api/ShareAPI.java             termux-app/src/main/res/xml/shortcuts.xml             termux-app/build.gradle.kts

      - name: Build release APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :termux-app:assembleRelease

      - name: Verify final application id and APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find termux-app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -s "$APK"

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2="$(find "$SDK_DIR/build-tools" -type f -name aapt2 | sort -V | tail -n1)"
          "$AAPT2" dump badging "$APK" | head -n 5
          "$AAPT2" dump badging "$APK" | grep "package: name='com.termux.localnet'"

          mkdir -p ../upload
          OUT="../upload/termux-localnet-googleplay.2026.06.21-arm64-release.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          ls -lh ../upload

      - name: Upload parallel install APK
        uses: actions/upload-artifact@v7
        with:
          name: termux-localnet-googleplay.2026.06.21-arm64
          path: upload/
          if-no-files-found: error
          retention-days: 30

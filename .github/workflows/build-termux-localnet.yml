name: Build parallel Termux LocalNet

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-termux-localnet.yml

permissions:
  contents: read

env:
  APP_ID: com.termxx
  APP_TAG: termux-app-googleplay.2026.06.21
  BOOTSTRAP_TAG: bootstrap-2026.06.21-r2
  PROOT_TAG: proot-2026.06.21-r1
  PROOT_VERSION: 5.1.107.80-0

jobs:
  build:
    name: Build parallel arm64 release APK
    runs-on: ubuntu-latest

    steps:
      - name: Clone Google Play Termux release
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${APP_TAG}" https://github.com/termux-play-store/termux-apps.git source

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and patch official arm64 prebuilts
        id: prebuilts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          BOOTSTRAP_URL="https://github.com/termux-play-store/termux-packages/releases/download/${BOOTSTRAP_TAG}/bootstrap-aarch64.zip"
          PROOT_URL="https://github.com/termux-play-store/termux-packages/releases/download/${PROOT_TAG}/libproot-loader-aarch64-${PROOT_VERSION}.so"

          curl -fL --retry 3 "$BOOTSTRAP_URL" -o /tmp/bootstrap-aarch64-original.zip
          curl -fL --retry 3 "$PROOT_URL" -o /tmp/libproot-loader-original.so

          python3 <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          import hashlib
          import struct
          import zlib

          old = b"com.termux"
          new = b"com.termxx"
          assert len(old) == len(new)

          src = Path("/tmp/bootstrap-aarch64-original.zip")
          dst = Path("termux-app/src/main/cpp/bootstrap-aarch64.zip")
          dst.parent.mkdir(parents=True, exist_ok=True)

          def patch_dex(data: bytes):
              if not data.startswith(b"dex\n"):
                  return data, 0

              count = data.count(old)
              if not count:
                  return data, 0

              patched = bytearray(data.replace(old, new))

              # DEX header: SHA-1 signature covers bytes [32:], then Adler32
              # checksum covers bytes [12:] including the updated signature.
              patched[12:32] = hashlib.sha1(patched[32:]).digest()
              patched[8:12] = struct.pack("<I", zlib.adler32(patched[12:]) & 0xffffffff)
              return bytes(patched), count

          def patch_termux_am_apk(data: bytes):
              source = BytesIO(data)
              target = BytesIO()
              dex_replacements = 0

              with ZipFile(source, "r") as zin, ZipFile(target, "w") as zout:
                  for inner_info in zin.infolist():
                      inner_data = zin.read(inner_info.filename)
                      if inner_info.filename.endswith(".dex"):
                          inner_data, count = patch_dex(inner_data)
                          dex_replacements += count
                      zout.writestr(inner_info, inner_data)

              if dex_replacements == 0:
                  raise SystemExit("termux-am am.apk contained no patchable com.termux string in DEX")

              return target.getvalue(), dex_replacements

          replaced = 0
          termux_am_replaced = 0
          with ZipFile(src, "r") as zin, ZipFile(dst, "w") as zout:
              for info in zin.infolist():
                  data = zin.read(info.filename)

                  if info.filename.endswith("libexec/termux-am/am.apk"):
                      data, count = patch_termux_am_apk(data)
                      termux_am_replaced += count
                  else:
                      count = data.count(old)
                      if count:
                          data = data.replace(old, new)
                          replaced += count

                  if "com.termux" in info.filename:
                      info.filename = info.filename.replace("com.termux", "com.termxx")

                  zout.writestr(info, data)

          if replaced == 0:
              raise SystemExit("bootstrap contained no com.termux references to patch")
          if termux_am_replaced == 0:
              raise SystemExit("termux-am package id was not patched")

          # Verify file contents in the patched zip no longer contain the old package id.
          with ZipFile(dst, "r") as z:
              leftovers = []
              for info in z.infolist():
                  if old in z.read(info.filename):
                      leftovers.append(info.filename)
              if leftovers:
                  raise SystemExit(f"unpatched bootstrap entries: {leftovers[:10]}")

          proot_src = Path("/tmp/libproot-loader-original.so")
          proot_dst = Path("termux-app/src/main/jniLibs/arm64-v8a/libproot-loader.so")
          proot_dst.parent.mkdir(parents=True, exist_ok=True)
          pdata = proot_src.read_bytes()
          proot_replaced = pdata.count(old)
          pdata = pdata.replace(old, new)
          proot_dst.write_bytes(pdata)

          bootstrap_sha = hashlib.sha256(dst.read_bytes()).hexdigest()
          proot_sha = hashlib.sha256(proot_dst.read_bytes()).hexdigest()

          print(f"bootstrap replacements: {replaced}")
          print(f"termux-am dex replacements: {termux_am_replaced}")
          print(f"proot replacements: {proot_replaced}")
          print(f"bootstrap sha256: {bootstrap_sha}")
          print(f"proot sha256: {proot_sha}")

          Path("/tmp/bootstrap.sha").write_text(bootstrap_sha)
          Path("/tmp/proot.sha").write_text(proot_sha)
          PY

          echo "bootstrap_sha=$(cat /tmp/bootstrap.sha)" >> "$GITHUB_OUTPUT"
          echo "proot_sha=$(cat /tmp/proot.sha)" >> "$GITHUB_OUTPUT"

      - name: Patch application id and Android 17 LAN permission
        working-directory: source
        shell: bash
        env:
          BOOTSTRAP_SHA: ${{ steps.prebuilts.outputs.bootstrap_sha }}
          PROOT_SHA: ${{ steps.prebuilts.outputs.proot_sha }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          APP_ID = "com.termxx"
          BOOTSTRAP_SHA = os.environ["BOOTSTRAP_SHA"]
          PROOT_SHA = os.environ["PROOT_SHA"]

          gradle = Path("termux-app/build.gradle.kts")
          manifest = Path("termux-app/src/main/AndroidManifest.xml")
          constants = Path("termux-app/src/main/java/com/termux/app/TermuxConstants.java")
          permissions = Path("termux-app/src/main/java/com/termux/app/TermuxPermissionUtils.java")
          activity = Path("termux-app/src/main/java/com/termux/app/TermuxActivity.java")
          content_provider = Path("termux-app/src/main/java/com/termux/app/TermuxContentProvider.java")
          share_api = Path("termux-app/src/main/java/com/termux/app/api/ShareAPI.java")
          usb_api = Path("termux-app/src/main/java/com/termux/app/api/UsbAPI.java")
          shortcuts = Path("termux-app/src/main/res/xml/shortcuts.xml")
          strings = Path("termux-app/src/main/res/values/strings.xml")

          # Gradle: keep Java namespace com.termux, but use a different Android application id.
          text = gradle.read_text()
          marker = "    defaultConfig {"
          if 'applicationId = "com.termxx"' not in text:
              if marker not in text:
                  raise SystemExit("defaultConfig marker not found")
              text = text.replace(marker, marker + '\n        applicationId = "com.termxx"', 1)

          text = text.replace(
              'versionName = "googleplay.2026.06.21"',
              'versionName = "googleplay.2026.06.21-localnet"',
              1,
          )
          text = text.replace(
              'abiFilters += listOf("armeabi-v7a", "arm64-v8a", "x86_64")',
              'abiFilters += listOf("arm64-v8a")',
              1,
          )

          # Only package arm64 bootstrap in this test build.
          old_arches = '''        val arches = mapOf(
                      "aarch64" to "0aaa4b890c4de28c1da01c2a12bfbf342009faf626e6b504aed303e6a936bebe",
                      "arm" to "a0c3f9c0bb313ad5e371150a462bfe975c0108a444cf6f7f8c89173b9e9dc5f8",
                      "x86_64" to "1799aef733532fe29eb913968302d681a9d22b5c38654b980330ceb0e182aa64"
                  )'''
          new_arches = f'''        val arches = mapOf(
                      "aarch64" to "{BOOTSTRAP_SHA}"
                  )'''
          if old_arches not in text:
              raise SystemExit("bootstrap checksum map marker not found")
          text = text.replace(old_arches, new_arches, 1)

          # Only package the patched arm64 proot loader.
          old_proot = '''        downloadFile(projectDir, "src/main/jniLibs/armeabi-v7a/libproot-loader.so", prootUrl.replace("ARCH", "arm"), "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855")
                  downloadFile(projectDir, "src/main/jniLibs/arm64-v8a/libproot-loader.so", prootUrl.replace("ARCH", "aarch64"), "f7e3211e4c210c2a39a1f22b7f38666d99aee172fd009c0d19b84108cf20bb42")
                  downloadFile(projectDir, "src/main/jniLibs/x86_64/libproot-loader.so", prootUrl.replace("ARCH", "x86_64"), "86e22d456255417e1d4ee874986571578ff26675ae2e372458e0d87f26454c63")'''
          new_proot = (
              '        downloadFile(projectDir, "src/main/jniLibs/arm64-v8a/libproot-loader.so", '
              'prootUrl.replace("ARCH", "aarch64"), "' + PROOT_SHA + '")'
          )
          if old_proot not in text:
              raise SystemExit("proot loader block marker not found")
          text = text.replace(old_proot, new_proot, 1)

          # Release APK still needs a signature to be installable.
          release_marker = '         getByName("release") {'
          signed_release = release_marker + '\n            signingConfig = signingConfigs.getByName("debug")'
          if signed_release not in text:
              if release_marker not in text:
                  raise SystemExit("release build type marker not found")
              text = text.replace(release_marker, signed_release, 1)

          gradle.write_text(text)

          # Runtime filesystem prefix must match the new package id.
          text = constants.read_text()
          old = 'public static final String PACKAGE_NAME = "com.termux";'
          if old not in text:
              raise SystemExit("TermuxConstants PACKAGE_NAME marker not found")
          constants.write_text(text.replace(
              old,
              'public static final String PACKAGE_NAME = "com.termxx";',
              1,
          ))

          # Globally unique manifest names so official Termux can stay installed.
          text = manifest.read_text()
          replacements = {
              "com.termux.permission.TERMUX_INTERNAL": "com.termxx.permission.TERMUX_INTERNAL",
              "com.termux.sharedfile.READ_WRITE": "com.termxx.sharedfile.READ_WRITE",
              'android:authorities="com.termux.documents"': 'android:authorities="com.termxx.documents"',
              'android:authorities="com.termux.files"': 'android:authorities="com.termxx.files"',
              'android:authorities="com.termux.sharedfile"': 'android:authorities="com.termxx.sharedfile"',
              'android:taskAffinity="com.termux.filereceiver"': 'android:taskAffinity="com.termxx.filereceiver"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"manifest marker not found: {old}")
              text = text.replace(old, new)

          if "android.permission.ACCESS_LOCAL_NETWORK" not in text:
              marker = '    <uses-permission android:name="android.permission.INTERNET" />'
              if marker not in text:
                  raise SystemExit("INTERNET permission marker not found")
              text = text.replace(
                  marker,
                  marker
                  + '\n    <!-- Android 17 / API 37 local network access -->'
                  + '\n    <uses-permission android:name="android.permission.ACCESS_LOCAL_NETWORK" />',
                  1,
              )
          manifest.write_text(text)

          # Runtime request for Android 17 local-network permission.
          text = permissions.read_text()
          if "REQUEST_ACCESS_LOCAL_NETWORK" not in text:
              marker = "    public static final int REQUEST_POST_NOTIFICATIONS = 2002;"
              if marker not in text:
                  raise SystemExit("permission request marker not found")
              text = text.replace(
                  marker,
                  marker
                  + '\n    public static final int REQUEST_ACCESS_LOCAL_NETWORK = 2003;'
                  + '\n    public static final String PERMISSION_ACCESS_LOCAL_NETWORK = "android.permission.ACCESS_LOCAL_NETWORK";',
                  1,
              )
              permissions.write_text(text)

          text = activity.read_text()
          if "REQUEST_ACCESS_LOCAL_NETWORK" not in text:
              marker = """        if (Build.VERSION.SDK_INT >= 33) {
                      TermuxPermissionUtils.requestPermissions(this,
                          TermuxPermissionUtils.REQUEST_POST_NOTIFICATIONS,
                          Manifest.permission.POST_NOTIFICATIONS
                      );
                  }
              """
              if marker not in text:
                  raise SystemExit("TermuxActivity permission block not found")
              text = text.replace(
                  marker,
                  marker + """
                  if (Build.VERSION.SDK_INT >= 37) {
                      TermuxPermissionUtils.requestPermissions(this,
                          TermuxPermissionUtils.REQUEST_ACCESS_LOCAL_NETWORK,
                          TermuxPermissionUtils.PERMISSION_ACCESS_LOCAL_NETWORK
                      );
                  }
              """,
                  1,
              )

          # termux-tools broadcasts these package-scoped actions. They must
          # match the renamed Android application id.
          for old_action, new_action in {
              '"com.termux.app.reload_style"': '"com.termxx.app.reload_style"',
              '"com.termux.app.request_storage_permissions"': '"com.termxx.app.request_storage_permissions"',
              '"com.termux.app.failsafe_session"': '"com.termxx.app.failsafe_session"',
          }.items():
              if old_action not in text:
                  raise SystemExit(f"TermuxActivity action marker not found: {old_action}")
              text = text.replace(old_action, new_action)

          activity.write_text(text)

          # Provider/action literals that refer to the Android package rather than Java namespace.
          text = content_provider.read_text()
          if '"com.termux.files"' not in text:
              raise SystemExit("content provider authority marker not found")
          content_provider.write_text(text.replace(
              '"com.termux.files"', '"com.termxx.files"', 1
          ))

          text = share_api.read_text()
          if '.authority("com.termux.sharedfile")' not in text:
              raise SystemExit("share provider authority marker not found")
          share_api.write_text(text.replace(
              '.authority("com.termux.sharedfile")',
              '.authority("com.termxx.sharedfile")',
              1,
          ))

          text = usb_api.read_text()
          text = text.replace(
              '"com.termux.api.USB_PERMISSION"',
              '"com.termxx.api.USB_PERMISSION"',
          )
          usb_api.write_text(text)

          text = shortcuts.read_text()
          text = text.replace(
              'android:targetPackage="com.termux"',
              'android:targetPackage="com.termxx"',
          )
          shortcuts.write_text(text)

          text = strings.read_text()
          if '<string name="application_name">Termux</string>' not in text:
              raise SystemExit("application_name marker not found")
          strings.write_text(text.replace(
              '<string name="application_name">Termux</string>',
              '<string name="application_name">Termux LocalNet</string>',
              1,
          ))

          for path in (
              gradle, manifest, constants, permissions, activity,
              content_provider, share_api, usb_api, shortcuts, strings
          ):
              clean = "\n".join(line.rstrip() for line in path.read_text().splitlines()) + "\n"
              path.write_text(clean)

          print("Application id:", APP_ID)
          print("Bootstrap sha256:", BOOTSTRAP_SHA)
          print("Proot sha256:", PROOT_SHA)
          PY

          git diff --check
          git diff --stat
          grep -R 'com.termxx'             termux-app/src/main/AndroidManifest.xml             termux-app/src/main/java/com/termux/app/TermuxConstants.java             termux-app/src/main/java/com/termux/app/TermuxContentProvider.java             termux-app/src/main/java/com/termux/app/api/ShareAPI.java             termux-app/src/main/res/xml/shortcuts.xml             termux-app/build.gradle.kts

      - name: Build release APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :termux-app:assembleRelease

      - name: Verify APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find termux-app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -s "$APK"

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2="$(find "$SDK_DIR/build-tools" -type f -name aapt2 | sort -V | tail -n1)"

          "$AAPT2" dump badging "$APK" | head -n 8
          "$AAPT2" dump badging "$APK" | grep "package: name='com.termxx'"
          "$AAPT2" dump permissions "$APK" | grep "android.permission.ACCESS_LOCAL_NETWORK"

          mkdir -p ../upload
          OUT="../upload/termux-localnet-com.termxx-googleplay.2026.06.21-arm64-release.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          ls -lh ../upload

      - name: Upload parallel install APK
        uses: actions/upload-artifact@v7
        with:
          name: termux-localnet-com.termxx-googleplay.2026.06.21-arm64
          path: upload/
          if-no-files-found: error
          retention-days: 30
